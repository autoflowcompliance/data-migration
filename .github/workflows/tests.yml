name: Tests

# Runs the suite the README documents, on the interpreter the Docker image
# ships (python:3.10-slim), from the requirements file alone. A green check here
# is the same command a buyer runs after a clone, so the badge cannot disagree
# with a local run.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes an in-flight run makes that run's result stale, so
# cancel it rather than spend minutes reporting on code nobody is looking at.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what the Docker image runs, so a break there breaks the
        # deployed app. 3.12 is the newest the dependencies support, and
        # catches a dependency that would only fail on a fresh interpreter.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # The suite writes runtime state under AUTOFLOW_HOME; pointing it at the
        # runner temp keeps the checkout clean and proves the portability the
        # tests assert, rather than letting state land in the repo.
        env:
          AUTOFLOW_HOME: ${{ runner.temp }}/autoflow
        run: python -m pytest -q

      # The database connector's SQLite tests always run, but SQLite needs no
      # server, no driver and no password, so they cannot catch a broken
      # PostgreSQL path. A real server on 3.10 turns the skip into a run.
      - name: Start PostgreSQL
        if: matrix.python-version == '3.10'
        run: |
          docker run -d --name pgtest \
            -e POSTGRES_PASSWORD=testpw \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_DB=testdb \
            -p 55432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec pgtest pg_isready -U testuser -d testdb >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready"; exit 1

      - name: Run the live database tests
        if: matrix.python-version == '3.10'
        env:
          AUTOFLOW_HOME: ${{ runner.temp }}/autoflow
          PGTEST_PW: testpw
          DATAREADY_TEST_POSTGRES_URL: postgresql://testuser@127.0.0.1:55432/testdb?password_env=PGTEST_PW
        run: |
          pip install psycopg2-binary
          python -m pytest tests/integration/test_postgres_live.py -q -rs

  # A single required check that a branch protection rule can point at, so
  # adding a matrix entry later does not silently leave a stale required check.
  tests-passed:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if the suite did not pass on every interpreter
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "the test job finished as ${{ needs.test.result }}"
            exit 1
          fi
          echo "all interpreters passed"
