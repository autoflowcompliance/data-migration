<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Stlite app</title>
    <link rel="stylesheet" href="./stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
import { mount } from "./stlite.js";

// pyodideUrl is forwarded to a Web Worker that runs from a data: URL, so
// relative paths can't be resolved there. Resolve to an absolute URL on the
// main thread first.
const pyodideUrl = new URL("./pyodide/pyodide.mjs", document.baseURI).href;

const [snapshot, prebuiltText] = await Promise.all([
  fetch("./site-packages-snapshot.tar.gz").then((r) => r.arrayBuffer()),
  fetch("./prebuilt-packages.txt").then((r) => r.text()),
]);
mount(
  {
    entrypoint: "app.py",
    files: {
      ".gitignore": { url: "./app_files/.gitignore" },
      ".streamlit/config.toml": { url: "./app_files/.streamlit/config.toml" },
      "admin.py": { url: "./app_files/admin.py" },
      "app.py": { url: "./app_files/app.py" },
      "auditors/post_import_auditor.py": { url: "./app_files/auditors/post_import_auditor.py" },
      "auditors/__init__.py": { url: "./app_files/auditors/__init__.py" },
      "cleaners/config.py": { url: "./app_files/cleaners/config.py" },
      "cleaners/pandas_cleaner.py": { url: "./app_files/cleaners/pandas_cleaner.py" },
      "cleaners/__init__.py": { url: "./app_files/cleaners/__init__.py" },
      "cli.py": { url: "./app_files/cli.py" },
      "configs/hubspot.yaml": { url: "./app_files/configs/hubspot.yaml" },
      "configs/pipedrive.yaml": { url: "./app_files/configs/pipedrive.yaml" },
      "configs/salesforce.yaml": { url: "./app_files/configs/salesforce.yaml" },
      "docs/admin_guide.md": { url: "./app_files/docs/admin_guide.md" },
      "docs/custom_crm_guide.md": { url: "./app_files/docs/custom_crm_guide.md" },
      "docs/deployment_guide.md": { url: "./app_files/docs/deployment_guide.md" },
      "docs/mapping_template.yaml": { url: "./app_files/docs/mapping_template.yaml" },
      "docs/professional_delivery_guide.md": { url: "./app_files/docs/professional_delivery_guide.md" },
      "mappers/schema.py": { url: "./app_files/mappers/schema.py" },
      "mappers/yaml_mapper.py": { url: "./app_files/mappers/yaml_mapper.py" },
      "mappers/__init__.py": { url: "./app_files/mappers/__init__.py" },
      "pipeline.py": { url: "./app_files/pipeline.py" },
      "pyproject.toml": { url: "./app_files/pyproject.toml" },
      "QUICK_START.md": { url: "./app_files/QUICK_START.md" },
      "README.md": { url: "./app_files/README.md" },
      "reporters/html_reporter.py": { url: "./app_files/reporters/html_reporter.py" },
      "reporters/__init__.py": { url: "./app_files/reporters/__init__.py" },
      "requirements-dev.txt": { url: "./app_files/requirements-dev.txt" },
      "requirements.txt": { url: "./app_files/requirements.txt" },
      "samples/messy_contacts.csv": { url: "./app_files/samples/messy_contacts.csv" },
      "SETUP_COMPLETE.md": { url: "./app_files/SETUP_COMPLETE.md" },
      "templates/audit_template.html": { url: "./app_files/templates/audit_template.html" },
      "templates/base.html": { url: "./app_files/templates/base.html" },
      "templates/report_template.html": { url: "./app_files/templates/report_template.html" },
      "TESTING_COMPLETE.md": { url: "./app_files/TESTING_COMPLETE.md" },
      "tests/test_auditor.py": { url: "./app_files/tests/test_auditor.py" },
      "tests/test_cleaner.py": { url: "./app_files/tests/test_cleaner.py" },
      "tests/test_mapper.py": { url: "./app_files/tests/test_mapper.py" },
      "tests/test_pipeline.py": { url: "./app_files/tests/test_pipeline.py" },
      "tests/test_transforms.py": { url: "./app_files/tests/test_transforms.py" },
      "tests/test_validator.py": { url: "./app_files/tests/test_validator.py" },
      "tests/__init__.py": { url: "./app_files/tests/__init__.py" },
      "TIERED_SYSTEM.md": { url: "./app_files/TIERED_SYSTEM.md" },
      "transforms.py": { url: "./app_files/transforms.py" },
      "validators/frictionless_validator.py": { url: "./app_files/validators/frictionless_validator.py" },
      "validators/quality_validator.py": { url: "./app_files/validators/quality_validator.py" },
      "validators/__init__.py": { url: "./app_files/validators/__init__.py" },
      "__init__.py": { url: "./app_files/__init__.py" },
    },
    archives: [
      {
        buffer: snapshot,
        format: "gztar",
        options: { extractDir: "/" },
      },
    ],
    prebuiltPackageNames: prebuiltText
      .split("\n")
      .map((s) => s.trim())
      .filter(Boolean),
    pyodideUrl,
    requirements: [],
  },
  document.getElementById("root"),
);
    </script>
  </body>
</html>
