<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Report{% endblock %}</title>
<style>
  :root { --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --ok:#047857; --warn:#b45309; --bad:#b91c1c; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--ink); margin: 0; padding: 40px; background: #f9fafb; }
  .sheet { max-width: 1040px; margin: 0 auto; background:#fff; padding: 40px;
           border: 1px solid var(--line); border-radius: 10px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h2 { margin: 34px 0 12px; font-size: 18px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .meta { color: var(--muted); font-size: 13px; }
  .cards { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 22px; }
  .card { flex: 1 1 150px; border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  .card .value { font-size: 24px; font-weight: 600; }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  table.data { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.data th, table.data td { border-bottom: 1px solid var(--line); padding: 7px 9px; text-align: left; }
  table.data th { background: #f3f4f6; font-weight: 600; }
  .empty { color: var(--muted); font-size: 13px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 36px; }
</style>
</head>
<body>
<div class="sheet">
{% block content %}{% endblock %}
<footer>Generated by {{ brand_name }} {{ tool_name }} on {{ generated_at }}.</footer>
</div>
</body>
</html>
