crm: Pipedrive
version: "1.0"
fields:
  - name: Name
    required: true
    sources: ["First Name", "Last Name"]
    separator: " "
    aliases: ["Full Name", "Contact Name"]
  - name: Email
    required: true
    unique: true
    transform: email_lowercase
    aliases: ["Email Address", "E-mail", "Primary Email"]
  - name: Phone
    transform: phone_e164
    aliases: ["Phone 1", "Phone Number", "Telephone", "Mobile"]
  - name: Organization
    aliases: ["Company", "Company Name", "Organisation", "Account Name"]
  - name: Job title
    aliases: ["Title", "Position", "Role"]
  - name: Address
    aliases: ["Street", "Street Address", "Address 1"]
  - name: Label
    aliases: ["Tag", "Segment", "Category"]
  - name: Owner
    aliases: ["Account Owner", "Assigned To", "Sales Rep"]
