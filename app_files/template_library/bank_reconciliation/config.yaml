crm: Bank Reconciliation
version: "1.0"
description: Normalise a bank statement or ledger for reconciliation.
fields:
  - name: date
    required: true
    transform: date_iso
    aliases: ["Date", "Transaction Date", "Trans Date", "Posting Date"]
  - name: description
    aliases: ["Description", "Details", "Narrative", "Memo", "Payee"]
  - name: amount
    required: true
    aliases: ["Amount", "Value", "Transaction Amount"]
  - name: balance
    aliases: ["Balance", "Running Balance"]
rules:
  - name: amount_present
    field: amount
    type: required
    severity: error
    message: "Statement line has no amount, so it cannot be reconciled"
  - name: amount_within_expected_range
    field: amount
    type: range
    min: -1000000
    max: 1000000
    severity: warning
    message: "Amount is unusually large for this account - check for a typo"
