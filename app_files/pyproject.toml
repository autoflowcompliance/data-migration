[project]
name = "autoflow-data-migration-tool"
version = "0.1.0"
description = "Clean, map, validate and audit CRM data migrations"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
