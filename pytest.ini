[pytest]
testpaths = app_files/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
# NiceGUI's test fixtures (``user``) are async. Auto mode lets them be used
# without decorating every test, which is the setup NiceGUI documents.
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:starlette.*