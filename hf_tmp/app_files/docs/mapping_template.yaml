# Template for creating custom CRM mapping configurations
# Copy this file and rename it to your_crm_name.yaml, then place in the configs/ directory

crm: Your CRM Name
version: "1.0"
fields:
  # Basic contact information
  - name: firstname
    required: true
    aliases: ["First Name", "Given Name", "fname", "Contact First Name"]
    # transform: email_lowercase  # Optional: apply transformation
  
  - name: lastname
    required: true
    aliases: ["Last Name", "Surname", "Family Name", "lname"]
  
  - name: email
    required: true
    unique: true
    transform: email_lowercase
    aliases: ["Email Address", "E-mail", "Primary Email", "Work Email"]
  
  # Phone numbers
  - name: phone
    transform: phone_e164
    aliases: ["Phone 1", "Phone Number", "Telephone", "Mobile", "Work Phone"]
  
  - name: mobile
    transform: phone_e164
    aliases: ["Mobile Phone", "Cell", "Cell Phone", "Phone 2"]
  
  # Company information
  - name: company
    aliases: ["Company Name", "Organisation", "Organization", "Account Name", "Employer"]
  
  - name: jobtitle
    aliases: ["Title", "Job Title", "Position", "Role"]
  
  # Address information
  - name: address
    aliases: ["Street", "Street Address", "Address 1", "Mailing Street"]
  
  - name: city
    aliases: ["Town", "Mailing City", "Billing City"]
  
  - name: state
    aliases: ["Province", "County", "Region", "Mailing State"]
  
  - name: zip
    aliases: ["Zip Code", "Postcode", "Postal Code", "Mailing Zip"]
  
  - name: country
    aliases: ["Nation", "Mailing Country", "Billing Country"]
  
  # Additional fields (customize based on your CRM)
  - name: website
    transform: lower_case
    aliases: ["Web Site", "URL", "Company Website", "Domain"]
  
  - name: notes
    aliases: ["Description", "Comments", "Details", "Internal Notes"]
  
  # Status/Stage fields
  - name: status
    default: lead
    aliases: ["Lifecycle Stage", "Stage", "Status", "Lead Status"]
  
  # Date fields
  - name: createdate
    transform: date_iso
    aliases: ["Created Date", "Date Created", "Created At", "Create Date"]
  
  - name: modifieddate
    transform: date_iso
    aliases: ["Modified Date", "Last Modified", "Updated Date"]

# Available transforms:
# - phone_e164: Convert phone numbers to E.164 format
# - email_lowercase: Convert email addresses to lowercase
# - date_iso: Convert dates to ISO format (YYYY-MM-DD)
# - trim: Remove leading/trailing whitespace
# - title_case: Convert to title case
# - upper_case: Convert to uppercase
# - lower_case: Convert to lowercase
# - digits_only: Keep only digits
# - ascii: Convert accented characters to ASCII
# - expand_scientific_notation: Expand Excel scientific notation
