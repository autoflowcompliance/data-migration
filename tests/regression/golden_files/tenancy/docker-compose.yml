# Generated by DataFlow. `docker compose up -d`.
services:
  dataflow:
    image: dataflow:2.0
    restart: unless-stopped
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    environment:
      AUTOFLOW_HOME: /app/run_config
      DATAREADY_HOME: /app/run_config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,os;urllib.request.urlopen('http://localhost:'+str(os.getenv('PORT',10000))+'/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
