crm: Orders
version: "1.0"
fields:
  - name: company
    aliases: ["Company"]
  - name: address
    aliases: ["Address"]
  - name: amount
    aliases: ["Amount"]
normalization:
  addresses:
    - column: address
  currency:
    target: USD
    columns: [amount]
    rates:
      - {base: EUR, quote: USD, rate: 1.08, as_of: 2026-01-15}
      - {base: GBP, quote: USD, rate: 1.27, as_of: 2026-01-15}
