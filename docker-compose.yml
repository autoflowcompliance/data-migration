services:
  autoflow:
    build: .
    image: autoflow-data-migration:latest
    container_name: autoflow
    ports:
      - "8501:8501"
    volumes:
      # Configs are editable from the host, so a new CRM format is a file drop
      # rather than a rebuild.
      - ./app_files/configs:/app/app_files/configs
      - ./app_files/samples:/app/app_files/samples
      - ./output:/app/output
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped