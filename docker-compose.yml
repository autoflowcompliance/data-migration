services:
  dataflow:
    build: .
    image: dataflow:latest
    container_name: dataflow
    ports:
      - "8080:8080"
    volumes:
      # Configs are editable from the host, so a new target system is a file
      # drop rather than a rebuild.
      - ./app_files/configs:/app/app_files/configs
      - ./app_files/samples:/app/app_files/samples
      # Branding and any licence live in the config home.
      - ./run_config:/root/.dataready
      - ./output:/app/output
    environment:
      - DATAREADY_HOST=0.0.0.0
      - DATAREADY_PORT=8080
      - DATAREADY_SHOW=0
      - DATAREADY_RELOAD=0
    restart: unless-stopped